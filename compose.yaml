services:
  nginx:
    image: tpham1467/nginx:latest
    container_name: nginx
    build:
      context: ./src/Nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
      - "80:80"
    networks:
      - app-network
    depends_on:
      - api

  api:
    image: tpham1467/api
    container_name: api
    build:
      context: ./src/Api
      dockerfile: Dockerfile
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    volumes:
      - ./src/DashboardSystem/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    env_file:
      - ./src/DashboardSystem/grafana.env
    volumes:
      - ./grafana:/var/lib/grafana8080
    depends_on:
      - prometheus
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

  