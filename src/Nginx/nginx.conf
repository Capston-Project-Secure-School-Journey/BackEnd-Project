worker_processes 3;

events { worker_connections 1024; }

http {
        sendfile on;
        large_client_header_buffers 4 32k;
        server {
            listen 80;
            client_max_body_size 30M;
            server_name _;

            return 301 https://$host$request_uri;
        }

        server {
                listen 443 default_server ssl;
                listen [::]:443 ssl;
                server_name _;
                client_max_body_size 30M;
                
                ssl_certificate /etc/letsencrypt/live/tpham.info/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/tpham.info/privkey.pem;
                
                location / {
                    proxy_set_header   Connection keep-alive;
                    proxy_set_header   Host test.tpham.info;
                    proxy_set_header   X-Real-IP $remote_addr;
                    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header   X-Forwarded-Proto $scheme;
                    proxy_set_header   X-Forwarded-Host test.tpham.info;

                    proxy_pass         http://api;
                }
                
                error_page 404 /NotFoundPage.html;
                location = /NotFoundPage.html {
                        root /var/www/html;
                        internal;
                }
        }
}
