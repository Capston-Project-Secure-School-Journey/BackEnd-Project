<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác thực địa chỉ email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f9fc;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 20px;
            background-color: #007bff;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 5px;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Xác thực địa chỉ email của bạn</h2>
    <p>Xin chào {{userName}},</p>
    <p>Bạn vừa đăng ký tài khoản trên hệ thống của chúng tôi. Vui lòng nhấn vào nút bên dưới để xác thực địa chỉ
        email:</p>

    <a href="{{verifyUrl}}" class="button">Xác thực email</a>

    <p>Nếu nút không hoạt động, bạn có thể sao chép và dán liên kết sau vào trình duyệt:</p>
    <p><a href="{{verifyUrl}}">{{verifyUrl}}</a></p>
</div>
</body>
</html>
